services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        ports:
            - "${APP_PORT:-8080}:80"
        environment:
            APP_ENV: production
            APP_DEBUG: "false"
            APP_KEY: ${APP_KEY:?Set APP_KEY in .env}
            APP_URL: ${APP_URL:-http://localhost:8080}
            DB_CONNECTION: mysql
            DB_HOST: db
            DB_PORT: 3306
            DB_DATABASE: ${DB_DATABASE:-healthcare}
            DB_USERNAME: ${DB_USERNAME:-healthcare}
            DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
            AI_SERVICE_URL: http://ai-service:8001
            AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?Set AI_SERVICE_TOKEN in .env}
            GROQ_API_KEY: ${GROQ_API_KEY:?Set GROQ_API_KEY in .env}
        depends_on:
            db:
                condition: service_healthy
            ai-service:
                condition: service_healthy

    ai-service:
        build:
            context: ./ai-service
            dockerfile: Dockerfile
        environment:
            AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?Set AI_SERVICE_TOKEN in .env}
        expose:
            - "8001"
        healthcheck:
            test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
            interval: 30s
            timeout: 5s
            retries: 3

    db:
        image: mysql:8.4
        environment:
            MYSQL_DATABASE: ${DB_DATABASE:-healthcare}
            MYSQL_USER: ${DB_USERNAME:-healthcare}
            MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
        volumes:
            - mysql-data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
            interval: 10s
            timeout: 5s
            retries: 10

volumes:
    mysql-data:
